{{ define "main" }}
<section class="wrap article">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <ul class="announcement-archive">
    {{ range .Pages.ByDate.Reverse }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
        <a href="{{ .RelPermalink }}"><h2>{{ .Title }}</h2></a>
        {{ with .Summary }}<p>{{ . }}</p>{{ end }}
      </li>
    {{ else }}
      <li class="muted">No posts yet.</li>
    {{ end }}
  </ul>
</section>
{{ end }}
